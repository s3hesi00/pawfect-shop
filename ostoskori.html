<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ostoskori</title>
<link rel="stylesheet" href="style2.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="footer" id="footer">
        <img src="kuvat/logo.png" alt="logo">
    </div>

    <a href="index.html"><button class="continueButton">< Jatka ostoksia</button></a>

    <div class="boxes">
        <div class="box1" id="box1">
            <h2>Ostoskori</h2>
            <p>Tuotteet</p>
        </div>

        <div class="box2" id="box2">
            <h2>Ostoskorin summa</h2>

            <div class="priceBox">
                <p>Tuotteet</p>
                <p>Toimitusmaksu</p>
                <hr style="width:50%;text-align:left;margin-left:0">
                <p>Maksettava yhteensä</p>
            </div>

            <p>Yhteystietosi</p>
            
            <div class="nameBox1">
                <label class="nameText" for="nimi">Nimi*</label>
                <input class="nimi" type="text" id="nimi" name="nimi"/>
            </div>

            <div class="nameBox2">
                <label class="emailText" for="sähköposti">Sähköposti*</label>
                <input class="email" type="text" id="sähköposti" name="sähköposti"/>
            </div>

            <div class="nameBox2">
                <label class="numberText" for="puhelinnumero">Puhelinnumero*</label>
                <input class="number" type="text" id="puhelinnumero" name="puhelinnumero"/>
            </div>

            <button class="tilausButton">Tee tilaus</button>
        </div>
    </div>

</body>
</html>
